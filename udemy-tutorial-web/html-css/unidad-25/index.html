<!-- flex-grow: para que los elementos crezcan
 si tienen espacio (dependera del espacio que tiene) se coloca
 en etiqueta style de la siguiente manera: flex-grow: 5 (el nro proporciona
 el tamano del crecimiento.)-->

<!-- style="flex-basis: 200px tamano ocupado en pixeles
  se aigna el valor como en el de "GROW"  y aunque la ventaja 
  se encoja, este mantiene el ancho-->
