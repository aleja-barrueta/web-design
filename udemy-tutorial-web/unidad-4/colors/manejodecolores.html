<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colors</title>
  </head>
  <body>
    <h1 style="color:deeppink">Colores en HTML</h1>
    <p style="color: hotpink">Color por nombre</p>
    <p style="color: rgb(255, 0, 217)">Color por rgb </p>
    <p style="border: 5px solid rgba(214, 128, 194, 0.5)">
      Color rgba con transparencia
    </p>
    <p style="color: hsl(328, 100%,54%);">Color por codigo hsl</p>
    <p style="border: 5px solid hsla(314, 51%, 67%, 0.5)">
      Color por codigo hsla con transparencia
    <p style="color: #ff69b4;">
        color por hexadecimal 
    </p>
  </body>
</html>
