<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iFrames Tutorial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1 class="titulo">Uso de iFrame en HTML</h1>
    <iframe
      src="texto.html"
      name="marco1"
      class="marco"
      frameborder="20"
      width="420"
      height="200"
    ></iframe>
    <div class="centrar">
      <a
        href="https://www.youtube.com/embed/tgbNymZ7vqY"
        rel="noreferrer"
        target="marco1"
        class="boton"
        >Cargar video de youtube</a
      >
    </div>
    <button class="btn-primary">Add</button>
  </body>
</html>
