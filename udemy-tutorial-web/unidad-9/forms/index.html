<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios en HTML</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h1>Formularios en HTML</h1>
    <form action="mi_servidor" >
      <fieldset>
        <legend>Datos Persona:</legend>
        <label for="nombre">Nombre:</label> <br />
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Escribe tu nombre"
          required="true"
        />
        <br />

        <label for="apellido">Apellido:</label> <br />
        <input
          type="text"
          id="apellido"
          name="apellido"
          placeholder="Escribe tu apellido"
          required="true"
        />
        <br />

        <label for="email"> Email: </label> <br />
        <input type="email" id="email" name="email" /> <br />

        <label for="edad">Edad </label> <br />
        <input type="number" id="edad" name="edad" /> <br />

        <label>Genero: </label> <br />
        <input type="radio" id="femenino" name="genero" value="femenino" />
        <label for="femenino">Femenino</label> <br />
        <input type="radio" id="masculio" name="genero" value="masculino" />
        <label for="masculino">Masculino</label> <br />

        <label> Genero musica favorita</label> <br />
        <input type="checkbox" id="clasica" name="musica" value="clasica" />
        <label for="clasica">Clasica</label>
        <input type="checkbox" id="Jazz" name="musica" value="Jazz" />
        <label for="jazz">Jazz</label> <br />
        <br />

        <label for="autos">Marca auto favorita</label>
        <br />
        <select name="autos" id="autos">
          <option value="volvo">Volvo</option>
          <option value="audi">Audi</option>
          <option value="bmw">BMW</option>
        </select>

        <label for="comentario">Comentario:</label> <br />
        <textarea name="comentario" id="comentario" rows="4" cols="30">
Este es mi comentario
          </textarea
        >
        <br />

        <br />
        <input type="submit" value="Enviar " />
        <input
          type="submit"
          formnovalidate="formnovalidate"
          value="Enviar sin validar"
        />
      </fieldset>
    </form>
  </body>
</html>

<!-- required="true" para campos OBLIGATORIOS, ejemplo
 es obligatorio colocar el nombre.-->
<!-- Si no es obligatorio simplemente no colocamos nada.-->
<!-- method="post" para que no se visualice la informacion
 en la URL de la pag. -->
<!-- method por defecto: GET -->
<!-- step="any" para decimales en los input. -->
<!-- Dentro del elemento select se puede agregar el atributo:
  multiple para seleccionar mas de una opcion
  valor = true.  -->
<!-- autocomplete="off" se usa para autocompletar
 con opciones en nombre y apellido on/off activar/desactivar -->
